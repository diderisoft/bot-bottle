# Build and publish the fixed images to the Gitea OCI registry, on release.
# Development builds locally (BOT_BOTTLE_INFRA_BUILD=local).
#
# One machine builds both architectures; emulation measured at 1.1-1.8x. delphi
# runs it because rootfs packaging needs e2fsprogs `mke2fs`.

name: publish-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable cross-architecture emulation
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64

      # The publisher's own token authenticates the generic-package uploads;
      # `docker push` uses the runtime's credential store, which is separate.
      - name: Log the container runtime in to the registry
        env:
          REGISTRY_TOKEN: ${{ secrets.BOT_BOTTLE_INFRA_ARTIFACT_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login gitea.dideric.is -u didericis --password-stdin

      - name: Build, push, and publish every image
        env:
          BOT_BOTTLE_INFRA_ARTIFACT_TOKEN: ${{ secrets.BOT_BOTTLE_INFRA_ARTIFACT_TOKEN }}
        run: |
          python3 -m bot_bottle.publish_images \
            --work-dir candidate \
            --platform linux/amd64 \
            --platform linux/arm64

      - name: Verify the manifest
        run: |
          cp candidate/published-artifacts.json published-artifacts.json
          python3 scripts/check_published_artifacts.py

      - name: Upload the manifest
        uses: actions/upload-artifact@v3
        with:
          name: published-artifacts
          path: candidate/published-artifacts.json

      - name: Log out
        if: always()
        run: docker logout gitea.dideric.is || true
