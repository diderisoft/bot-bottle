# Build and publish the fixed images to the Gitea OCI registry, on release.
# Development builds locally (BOT_BOTTLE_INFRA_BUILD=local).
#
# One machine builds both architectures; emulation measured at 1.1-1.8x. delphi
# runs it because rootfs packaging needs e2fsprogs `mke2fs`.

name: publish-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      images:
        description: "Images to publish (space-separated). Default: all."
        required: false
      owner:
        description: >-
          Registry owner to publish under. Set to a scratch owner to rehearse
          the flow without writing to the real namespace.
        required: false
        default: didericis

jobs:
  publish:
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The installer reports success even when the registration does not take
      # effect — it registers inside its own mount namespace, so with
      # binfmt_misc unmounted on the host nothing propagates and every arm64
      # build later dies with "exec format error". Prove emulation works before
      # spending a build on it.
      - name: Enable and verify cross-architecture emulation
        run: |
          docker run --rm --privileged tonistiigi/binfmt:latest --install arm64
          docker run --rm --platform linux/arm64 alpine:3 uname -m | grep -q aarch64 || {
            echo "arm64 emulation is not active on this runner."
            echo "binfmt_misc is likely unmounted; register it declaratively:"
            echo "  boot.binfmt.emulatedSystems = [ \"aarch64-linux\" ];"
            exit 1
          }

      # Two separate credentials for one registry: the publisher sends the token
      # as an Authorization header on the generic-package PUTs, while
      # `docker push` reads the runtime's credential store. Gitea's registry
      # advertises the standard bearer/token realm, so the token goes in as the
      # password — via stdin, to keep it out of argv and the process list.
      - name: Log the container runtime in to the registry
        env:
          REGISTRY_USER: ${{ github.event.inputs.owner || 'didericis' }}
          REGISTRY_TOKEN: ${{ secrets.BOT_BOTTLE_INFRA_ARTIFACT_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" \
            | docker login gitea.dideric.is -u "$REGISTRY_USER" --password-stdin

      - name: Build, push, and publish every image
        env:
          BOT_BOTTLE_INFRA_ARTIFACT_TOKEN: ${{ secrets.BOT_BOTTLE_INFRA_ARTIFACT_TOKEN }}
          BOT_BOTTLE_INFRA_ARTIFACT_OWNER: ${{ github.event.inputs.owner || 'didericis' }}
        run: |
          python3 -m bot_bottle.publish_images \
            --work-dir candidate \
            --platform linux/amd64 \
            --platform linux/arm64 \
            $(for i in ${{ github.event.inputs.images }}; do printf -- '--image %s ' "$i"; done)

      - name: Verify the manifest
        run: |
          cp candidate/published-artifacts.json published-artifacts.json
          python3 scripts/check_published_artifacts.py

      - name: Upload the manifest
        uses: actions/upload-artifact@v3
        with:
          name: published-artifacts
          path: candidate/published-artifacts.json

      - name: Log out
        if: always()
        run: docker logout gitea.dideric.is || true
