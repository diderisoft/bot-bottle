# Build and publish the fixed images to the Gitea OCI registry, on release.
# Development builds locally (BOT_BOTTLE_INFRA_BUILD=local).
#
# One machine builds both architectures; emulation measured at 1.1-1.8x on
# delos. delphi runs it because rootfs packaging needs e2fsprogs `mke2fs`.
#
# Unverified: delphi emulates arm64 with QEMU, not Rosetta, so it may be much
# slower. If so, move the arm64 OCI build to `[self-hosted, macos]` and merge
# the manifest parts (`--merge`); packaging stays here either way.

name: publish-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      images:
        description: "Space-separated image names (default: all)"
        required: false

jobs:
  publish:
    runs-on: [self-hosted, kvm]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable cross-architecture emulation
        run: docker run --rm --privileged tonistiigi/binfmt:latest --install arm64

      # One invocation — `--publish-dir` builds as well as uploads, so
      # splitting the steps would rebuild.
      - name: Build, push, and publish every image
        env:
          BOT_BOTTLE_INFRA_ARTIFACT_TOKEN: ${{ secrets.BOT_BOTTLE_INFRA_ARTIFACT_TOKEN }}
        run: |
          python3 -m bot_bottle.publish_images \
            --publish-dir candidate \
            --platform linux/amd64 \
            --platform linux/arm64

      - name: Verify the manifest
        run: |
          cp candidate/published-artifacts.json published-artifacts.json
          python3 scripts/check_published_artifacts.py

      - name: Upload the manifest
        uses: actions/upload-artifact@v3
        with:
          name: published-artifacts
          path: candidate/published-artifacts.json
