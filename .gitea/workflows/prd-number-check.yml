name: prd-number-check

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches: [main]
  # A merge can take a number an open PR already claimed, so re-check them.
  push:
    branches: [main]
    paths:
      - 'docs/prds/**'

jobs:
  require-numbered-prds:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        # Gitea runs pull_request workflows against the PR head, not a merge
        # commit, so the numbers already on the base are not in this tree.
        run: |
          git fetch --no-tags origin \
            "+refs/heads/${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Require final, unique PRD numbers
        run: python3 scripts/check_prd_numbers.py check --base-ref "origin/${{ github.base_ref }}"

  revalidate-open-prs:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Re-run this check on every open PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional PAT, only needed if the run-scoped token cannot rerun.
          PRD_RERUN_TOKEN: ${{ secrets.PRD_RERUN_TOKEN }}
        run: python3 scripts/check_prd_numbers.py rerun-open-prs
